<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>React App Választó</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    nav {
      background-color: #333;
      padding: 1rem;
    }
    nav button {
      margin: 0 1rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 5px;
    }
    iframe {
      width: 100%;
      height: 90vh;
      border: none;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <nav>
    <button onclick="loadApp('flip-coin')">🪙 Flip Coin</button>
    <button onclick="loadApp('guess-number')">🔢 Guess Number</button>
  </nav>

  <iframe id="app-frame" src="" title="React App"></iframe>

  <script>
    function loadApp(appName) {
      document.getElementById('app-frame').src = `${appName}/index.html`;
    }
  </script>
</body>
</html>
